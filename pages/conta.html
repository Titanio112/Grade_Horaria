<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua conta — Grade Horária</title>
  <!-- Bootstrap do tema (antes do CSS = sem flash; espelha o toggle) -->
  <script>
    (function(){var t=null;try{t=localStorage.getItem('gh-theme');}catch(e){}
    if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
    document.documentElement.dataset.theme=t;})();
  </script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <header class="wordmark">
      <span class="glyph" aria-hidden="true"><i></i><i class="hl"></i><i></i><i></i><i></i><i></i></span>
      Grade Horária
    </header>

    <section class="card">
      <h1>Sua conta</h1>
      <p class="card-subtitle">Login realizado com sucesso.</p>

      <div class="account-head">
        <span class="avatar" id="account-avatar" aria-hidden="true">…</span>
        <div class="who">
          <div class="label">Logado como</div>
          <div class="name" id="account-name">Carregando…</div>
        </div>
      </div>

      <ul class="account-meta">
        <li>
          <strong>E-mail</strong>
          <span id="account-email">—</span>
        </li>
        <li>
          <strong>Curso</strong>
          <span id="account-course">—</span>
        </li>
      </ul>

      <a class="btn btn-primary btn-block account-cta" href="grade.html">Ir para minha grade</a>
      <button class="btn btn-secondary" id="logout-button" type="button">Sair</button>
    </section>
  </main>

  <script type="module" src="../js/pages/conta.page.js"></script>
</body>
</html>
