<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha — Grade Horária</title>
  <!-- Bootstrap do tema (antes do CSS = sem flash; espelha o toggle) -->
  <script>
    (function(){var t=null;try{t=localStorage.getItem('gh-theme');}catch(e){}
    if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
    document.documentElement.dataset.theme=t;})();
  </script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/motion.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <header class="wordmark">
      <span class="glyph" aria-hidden="true"><i></i><i class="hl"></i><i></i><i></i><i></i><i></i></span>
      Grade Horária
    </header>

    <section class="card">
      <h1>Recuperar senha</h1>
      <p class="card-subtitle">Enviaremos um link de redefinição para o seu e-mail.</p>

      <form id="recuperar-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" inputmode="email"
                 autocomplete="email" required aria-describedby="email-error">
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <button class="btn btn-primary" type="submit">Enviar link de recuperação</button>
      </form>

      <div id="recover-success" hidden>
        <img class="state-icon"
             src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Incoming%20envelope/3D/incoming_envelope_3d.png"
             alt="">
        <p class="state-message success" role="status">
          Se <strong id="recover-success-email"></strong> estiver cadastrado,
          você vai receber um link para redefinir a senha. Confira também o spam.
        </p>
      </div>

      <p class="auth-switch"><a href="login.html">Voltar para o login</a></p>
    </section>
  </main>

  <script type="module" src="../js/pages/recuperar.page.js"></script>
</body>
</html>
